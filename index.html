<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#6b7585;--ln:#e1e6ee;--pri:#1f4fd8;--ok:#1e9e5a;--okbg:#e3f6ec;--missbg:#fdeeee;
--e:#9aa5b5;--q:#e8742b;--l:#2b7be8;--t:#d9a400;--s:#4aa86a;--x:#d6336c;--r:#c4cad5;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#18202f;--tx:#e8edf6;--mut:#93a0b5;--ln:#28324a;--pri:#6b93ff;--ok:#4cd08a;--okbg:#14382a;--missbg:#34202a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#18202f;--tx:#e8edf6;--mut:#93a0b5;--ln:#28324a;--pri:#6b93ff;--ok:#4cd08a;--okbg:#14382a;--missbg:#34202a}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"SF Pro Text",Arial,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;width:100%;max-width:640px;margin:0 auto;padding:6px 14px 14px;touch-action:pan-y}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.big{font-size:34px;font-weight:700;color:var(--pri);line-height:1.1}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);width:0}
.d{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--r);border-radius:10px;padding:9px 10px;margin:7px 0}
.d.t-e{border-left-color:var(--e)}.d.t-q{border-left-color:var(--q)}.d.t-l{border-left-color:var(--l)}.d.t-t{border-left-color:var(--t)}.d.t-s{border-left-color:var(--s)}.d.t-x{border-left-color:var(--x)}
.d.done{background:var(--okbg)}
.dh{display:flex;justify-content:space-between;gap:8px}.tp{font-size:12px;color:var(--mut)}
.ds{margin:3px 0;font-size:14px}
.df{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.df input{width:84px;padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.ck{margin-left:0;min-width:44px;height:36px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--mut);font-size:18px}
.d.done .ck{background:var(--ok);color:#fff;border-color:var(--ok)}
details{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin:10px 0;padding:0 10px}
summary{padding:12px 2px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}summary small{color:var(--mut);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
nav{flex:0 0 auto;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 8px;font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--pri);font-weight:600}
section{display:none;zoom:var(--z,1)}section.on{display:block}
section>h1:first-child,section>h1:first-child+.sub{display:none}
header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
#hbar{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#tm{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.5px}#dt{font-size:12px;color:var(--mut);margin-left:6px}
#wx1{font-size:15px;font-weight:600;white-space:nowrap}#wx2{max-width:640px;margin:2px auto 8px;font-size:12px;color:var(--mut);line-height:1.4;min-height:17px}
#hrow{max-width:640px;margin:0 auto;position:relative}#hdi{padding-right:64px}
